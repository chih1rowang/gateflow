spring:
  application:
    name: gateflow-workers
  # 从仓库根目录的 .env 读取密钥（KEY=VALUE 格式按 properties 解析；两个路径覆盖"从根目录/从模块目录启动"两种情况）
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    # gateflow-mysql 容器（宿主机 3307；本机 3306 被系统 MySQL 占用）
    url: jdbc:mysql://localhost:3307/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: gateflow_dev_123
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  # workers 的 HTTP 能力（W2）：SSE 流式问答 + admin 端点。8080 被 Conductor 占用、8090 是 gateway
  port: 8081

gateflow:
  # Conductor 引擎的 API 地址（docker-compose 里的 conductor 容器）
  conductor-api: http://localhost:8080/api
  # 管理端点共享口令（/admin/** 与 /stream/** 必须携带 X-Admin-Token: <该值>）
  admin-token: ${GATEFLOW_ADMIN_TOKEN:dev-admin-token}
  # db_query 专用只读账号：只对 expense_records 一张表有 SELECT 权限（纵深防御第二层）
  db:
    ro:
      url: ${GATEFLOW_RO_URL:jdbc:mysql://localhost:3307/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: gateflow_ro
      password: gateflow_ro_pw
  deepseek:
    base-url: https://api.deepseek.com
    model-name: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY}
  rag:
    # 制度文档库（相对于仓库根目录启动；IDEA 里运行请把工作目录设为仓库根）
    docs-path: ./deploy/knowledge
    # 每次检索返回的最相关片段数
    max-results: 3
    # 混合检索（BM25+向量 RRF 融合）：W4 评测 97.0%→100.0%，胜出设为默认
    hybrid: true
