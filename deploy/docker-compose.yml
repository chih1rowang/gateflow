# GateFlow 全家桶（W4：7 服务一键部署；2026-10 安全加固见审查报告）
# 启动：cd deploy && docker compose up -d --build
# 国内网络拉镜像：见本目录 README.md（镜像前缀 + tag 法）
# 对外仅暴露 nginx 入口 8088；其余端口全部绑定 127.0.0.1（只供本机开发调试，
# 局域网不可达；容器之间走内部网络通信，不依赖这些映射）：
#   127.0.0.1:5000(conductor UI) 8080(conductor API) 3307(mysql) 6379(redis) 9092(kafka) 8090(gateway)

name: gateflow

services:
  conductor:
    image: conductoross/conductor:next
    container_name: gateflow-conductor
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: gateflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: gateflow_dev_123
      MYSQL_DATABASE: gateflow
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"   # 宿主机 3306 被本机 MySQL 服务占用
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 首次建库自动执行
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pgateflow_dev_123"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gateflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # KRaft 单节点（无 Zookeeper）；双监听器：容器内 kafka:29092 / 宿主机 localhost:9092
  kafka:
    image: apache/kafka:3.9.0
    container_name: gateflow-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MlU7g3nShT-eMCtK--X86sw
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: gateflow-gateway
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SPRING_APPLICATION_JSON: >-
        {
          "spring": {
            "datasource": {"url": "jdbc:mysql://mysql:3306/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"},
            "data": {"redis": {"host": "redis"}},
            "kafka": {"bootstrap-servers": "kafka:29092"}
          },
          "gateflow": {
            "workers-base-url": "http://workers:8081"
          }
        }
      GATEFLOW_AUDIT_MODE: ${GATEFLOW_AUDIT_MODE:-kafka}
      # 压测时放宽限流：GATEFLOW_RATELIMIT_MAXREQUESTS=1000000 docker compose up -d gateway
      GATEFLOW_RATELIMIT_MAXREQUESTS: ${GATEFLOW_RATELIMIT_MAXREQUESTS:-10}
    env_file:
      - ../.env   # JWT_SECRET
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    restart: unless-stopped

  workers:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.workers
    container_name: gateflow-workers
    # 不向宿主机发布端口：/api/** 只允许网关经内部网络调用（审查报告严重 1）
    environment:
      SPRING_APPLICATION_JSON: >-
        {
          "spring": {
            "datasource": {"url": "jdbc:mysql://mysql:3306/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"}
          },
          "gateflow": {
            "conductor-api": "http://conductor:8080/api",
            "rag": {"docs-path": "/app/knowledge"},
            "db": {"ro": {"url": "jdbc:mysql://mysql:3306/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai", "username": "gateflow_ro", "password": "gateflow_ro_pw"}}
          }
        }
    env_file:
      - ../.env   # DEEPSEEK_API_KEY、GATEFLOW_ADMIN_TOKEN
    volumes:
      - ./knowledge:/app/knowledge   # 换语料改这里，免重建镜像
    depends_on:
      mysql:
        condition: service_healthy
      conductor:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: gateflow-nginx
    ports:
      - "8088:80"   # 唯一对外端口（统一入口；演示口令见 .env 的 GATEFLOW_ADMIN_TOKEN）
    # /conductor/ 的口令校验值在模板替换时取自容器环境——经 env_file 注入 ../.env 的真实值
    env_file:
      - ../.env
    volumes:
      # 官方镜像把 templates/*.template 做 envsubst 后生成 conf.d 配置（/conductor/ 口令校验需要）
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../panel/dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway
      - workers
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
