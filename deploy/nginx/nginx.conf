events {
    worker_connections 1024;
}

http {
    # W4：统一入口反向代理。客户端只知 nginx，内部拓扑对客户端透明。
    # SSE 关键配置：proxy_buffering off（否则流式输出被缓冲成整段——实测验证项）
    server {
        listen 80;

        # MCP 协议入口 -> gateway
        location /mcp {
            proxy_pass http://gateway:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        # 知识库热重载 -> workers（更长前缀优先于下面的 /admin/）
        location /admin/knowledge/ {
            proxy_pass http://workers:8081;
        }

        # 令牌签发（开发端点）-> gateway
        location /admin/ {
            proxy_pass http://gateway:8090;
            proxy_set_header Host $host;
        }

        # SSE 流式问答 -> workers（禁缓冲 + 长读超时 + 1.1 保持连接）
        location /stream/ {
            proxy_pass http://workers:8081;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_read_timeout 300s;
        }

        # 工具 REST（doc_search/db_query/ticket 的宿主接口）-> workers
        location /api/ {
            proxy_pass http://workers:8081;
        }

        # Conductor API（面板看板数据源/审批动作）
        location /conductor/ {
            proxy_pass http://conductor:8080/;
            proxy_set_header Host $host;
        }

        # 面板静态资源（Vue3 构建产物，构建见 panel/README 说明；仓库附带预构建 dist）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
