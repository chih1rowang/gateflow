events {
    worker_connections 1024;
}

http {
    # W4：统一入口反向代理。客户端只知 nginx，内部拓扑对客户端透明。
    # SSE 关键配置：proxy_buffering off（否则流式输出被缓冲成整段——实测验证项）
    server {
        listen 80;

        # MCP 协议入口 -> gateway
        location /mcp {
            proxy_pass http://gateway:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }

        # 令牌签发（开发端点）-> gateway
        location /admin/ {
            proxy_pass http://gateway:8090;
            proxy_set_header Host $host;
        }

        # SSE 流式问答 -> workers（禁缓冲 + 长读超时 + 1.1 保持连接）
        location /stream/ {
            proxy_pass http://workers:8081;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_read_timeout 300s;
        }

        # 工具 REST（doc_search/db_query/ticket 的宿主接口）-> workers
        location /api/ {
            proxy_pass http://workers:8081;
        }

        # 面板占位（W5 上线 Vue3 静态资源）
        location / {
            default_type text/plain;
            return 200 'GateFlow nginx is up. Panel lands in W5.';
        }
    }
}
