name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build gateway
        run: mvn -B -f gateway/pom.xml package
      - name: Build workers (unit tests only; RecallEvalIT excluded, needs local corpus)
        run: mvn -B -f workers/pom.xml package

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml
      - name: Build panel
        run: cd panel && pnpm install --frozen-lockfile && pnpm build
