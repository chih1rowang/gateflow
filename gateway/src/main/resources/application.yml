spring:
  application:
    name: gateflow-gateway
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  ai:
    mcp:
      server:
        name: gateflow-gateway
        # Streamable HTTP 传输（SSE 传输自 Spring AI 2.0 起废弃——本身就是一道八股）
        protocol: STREAMABLE
  datasource:
    url: jdbc:mysql://localhost:3307/gateflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: gateflow_dev_123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: gateflow-audit-consumer
      auto-offset-reset: earliest

server:
  port: 8090

gateflow:
  # 管理端点共享口令（/admin/** 必须携带 X-Admin-Token: <该值>；生产从环境变量注入）
  admin-token: ${GATEFLOW_ADMIN_TOKEN:dev-admin-token}
  jwt:
    # 密钥来自 .env（真值不入库）；HS256
    secret: ${JWT_SECRET}
    ttl-hours: 24
  ratelimit:
    # 滑动窗口：60 秒内每客户端最多 10 次（第 11 次 429）
    window-seconds: 60
    max-requests: 10
  # 工具宿主（workers）地址——gateway 是纯门口，工具实现全在那边
  workers-base-url: http://localhost:8081
  audit:
    # sync=直写MySQL（W3形态，压测对照）| kafka=异步落库（W4形态，压测实验）——成对数字的开关
    mode: sync
